# ~/.tmux.conf — global tmux config

# --- Pane splitting (no prefix needed) ---
# Option+.  -> split vertically (panes side by side, vertical divider)
bind -n M-. split-window -h -c "#{pane_current_path}"
# Option+,  -> split horizontally (panes stacked, horizontal divider)
bind -n M-, split-window -v -c "#{pane_current_path}"

# --- Switch panes ---
# Option+Tab -> cycle panes CLOCKWISE by on-screen position (TL->TR->BR->BL->TL).
# Position-aware, so it's immune to pane renumbering and to the Option+= snap.
#   on top edge & not at right  -> move right
#   on right edge & not at bottom -> move down
#   on bottom edge & not at left -> move left
#   otherwise (left edge)        -> move up
bind -n M-Tab {
  if -F "#{&&:#{pane_at_top},#{?pane_at_right,0,1}}" {
    select-pane -R
  } {
    if -F "#{&&:#{pane_at_right},#{?pane_at_bottom,0,1}}" {
      select-pane -D
    } {
      if -F "#{&&:#{pane_at_bottom},#{?pane_at_left,0,1}}" {
        select-pane -L
      } {
        select-pane -U
      }
    }
  }
}

# --- Resize panes (no prefix needed) ---
# Left/right on ; and ' ; up/down on the arrows. All send clean ESC-<key>.
bind -n "M-;" resize-pane -L 5
bind -n "M-'" resize-pane -R 5
bind -n M-Up   resize-pane -U 5
bind -n M-Down resize-pane -D 5
# Option+= -> snap panes back to an even 2x2 grid
bind -n M-= select-layout tiled

# Keep new panes in the current pane's directory (already set above via -c)
