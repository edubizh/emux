# ~/.tmux.conf — global tmux config

# --- Pane splitting (no prefix needed) ---
# Option+.  -> split vertically (panes side by side, vertical divider)
bind -n M-. split-window -h -c "#{pane_current_path}"
# Option+,  -> split horizontally (panes stacked, horizontal divider)
bind -n M-, split-window -v -c "#{pane_current_path}"

# --- Switch panes ---
# Option+Tab -> next pane CLOCKWISE around the window.
# Delegates to the emux helper, which orders panes by the angle of their center
# around the window center and steps to the next one. That order is a full
# permutation of the panes, so it ALWAYS visits every pane once per lap and can
# never get stuck bouncing between two panes on irregular/overlapping layouts
# (the failure mode of edge-walking with select-pane -L/-R/-U/-D).
# If the helper isn't installed, fall back to tmux's built-in next-pane, which
# is also a complete cycle (just not clockwise), so this binding never breaks.
bind -n M-Tab if-shell '[ -x "$HOME/.config/emux/bin/emux-pane-cycle" ]' \
    'run-shell "$HOME/.config/emux/bin/emux-pane-cycle"' \
    'select-pane -t :.+'

# --- Resize panes (no prefix needed) ---
# Left/right on ; and ' ; up/down on the arrows. All send clean ESC-<key>.
bind -n "M-;" resize-pane -L 5
bind -n "M-'" resize-pane -R 5
bind -n M-Up   resize-pane -U 5
bind -n M-Down resize-pane -D 5
# Option+= -> snap panes back to an even 2x2 grid
bind -n M-= select-layout tiled

# Keep new panes in the current pane's directory (already set above via -c)
